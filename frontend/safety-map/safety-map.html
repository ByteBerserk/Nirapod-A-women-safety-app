<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Safety Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <link rel="stylesheet" href="safety-map.css">
</head>

<body>

    <div class="page-container">

        <div class="page-header">
            <div>
                <h1>Community Safety Map</h1>
                <p>
                    View reported safety incidents and identify potentially unsafe areas.
                </p>
            </div>

            <button id="backButton">
                ← Back to Dashboard
            </button>
        </div>

        <div class="map-info">
            <strong>📍 Reported Incidents</strong>
            <span id="incidentCount">Loading...</span>
        </div>

        <div id="map"></div>

        <div id="mapMessage" class="map-message">
            Loading incidents...
        </div>

    </div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script src="safety-map.js"></script>

</body>
</html>
