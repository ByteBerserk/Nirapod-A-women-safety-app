<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nirapod | Safe Community Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth/auth.css" />
    <link rel="stylesheet" href="auth/signup.css" />
    <link rel="stylesheet" href="auth/login.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="background-glow glow-one"></div>
      <div class="background-glow glow-two"></div>

      <main class="auth-card">
        <section class="brand-panel">
          <div class="brand-badge">NIRAPOD</div>
          <h1>Women safety, protected with care.</h1>
        </section>

        <section class="form-panel">
          <div class="toggle-switch" role="tablist" aria-label="Auth mode switch">
            <button class="toggle-btn active" data-form="login" type="button">
              Sign In
            </button>
            <button class="toggle-btn" data-form="signup" type="button">
              Create Account
            </button>
          </div>

          <form id="loginForm" class="auth-form active" novalidate>
            <label>
              Username or Email
              <input type="text" name="identifier" required />
            </label>

            <label>
              Password
              <input type="password" name="password" required />
            </label>

            <div id="loginMessage" class="form-message" role="alert"></div>
            <button class="submit-btn" type="submit">Sign In</button>
          </form>

          <form id="signupForm" class="auth-form" novalidate enctype="multipart/form-data">
            <div class="warning-panel">
              <div id="signupMessage" class="form-message" role="alert"></div>
            </div>
            <div class="form-grid">
              <label>
                Full Name
                <input type="text" name="fullName" required />
              </label>

              <label class="profile-picker-field">
                Profile Picture
                <div class="profile-picker">
                  <input id="profilePicture" name="profileImage" type="file" accept="image/*" required aria-label="Upload profile picture" hidden />
                  <div class="upload-row">
                    <button type="button" id="profileUploadBtn" class="upload-btn">Choose file</button>
                    <span id="profileFilename" class="upload-filename">No file chosen</span>
                  </div>
                  <div class="avatar-preview-container" id="avatarPreviewContainer" role="button" aria-label="Open profile picture selector">
                    <img id="profilePreview" class="avatar-preview" alt="Profile preview" />
                    <button type="button" id="removeProfilePic" class="remove-avatar-btn" aria-label="Remove profile picture">×</button>
                  </div>
                </div>
              </label>

              <label>
                Phone Number
                <input type="tel" name="phone" pattern="01\d{9}" maxlength="11" required />
                <span class="field-help">Enter 11 digits starting with 01.</span>
              </label>

              <label>
                Blood Group
                <select name="bloodGroup" required>
                  <option value="">Select</option>
                  <option>A+</option>
                  <option>A-</option>
                  <option>B+</option>
                  <option>B-</option>
                  <option>AB+</option>
                  <option>AB-</option>
                  <option>O+</option>
                  <option>O-</option>
                </select>
              </label>

              <label>
                Gender
                <select name="gender" required>
                  <option value="">Select</option>
                  <option>Female</option>
                  <option>Male</option>
                  <option>Non-binary</option>
                  <option>Prefer not to say</option>
                </select>
              </label>

              <label>
                Job / Profession
                <select name="job" required>
                  <option value="">Select</option>
                  <option>Student</option>
                  <option>Teacher</option>
                  <option>Engineer</option>
                  <option>Doctor</option>
                  <option>Other Profession</option>
                </select>
              </label>

              <label class="full-span">
                Emergency Medical Information
                <textarea name="medicalInfo" rows="3" placeholder="Example: allergies, medications, blood type, or any critical care notes."></textarea>
                <span class="field-help">Add any medical details responders should know in an emergency.</span>
              </label>

              <label class="full-span">
                Address
                <textarea name="address" rows="3" required placeholder="Enter your home address or a safe contact location."></textarea>
                <span class="field-help">Provide the location where help can find you quickly.</span>
              </label>

              <label>
                Email
                <input type="email" name="email" required />
                <span class="field-help">Use a valid Gmail address.</span>
              </label>

              <label>
                Username
                <input type="text" name="username" required />
              </label>

              <label>
                Password
                <input type="password" name="password" required />
              </label>

              <label>
                Confirm Password
                <input type="password" name="confirmPassword" required />
              </label>
            </div>

            <button class="submit-btn" type="submit">Create Account</button>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="./auth/signup.js"></script>
    <script type="module" src="./auth/login.js"></script>
  </body>
</html>
